apiVersion: apps/v1
kind: Deployment

metadata:
  name: grading-db-pod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grading-db

  template:
    metadata:
      labels:
        app: grading-db

    spec:
      containers:
      - name: grading-db-container
        image: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: password123

        ports:
        - containerPort: 3306