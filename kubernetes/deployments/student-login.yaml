apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-login-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-login

  template:
    metadata:
      labels:
        app: student-login

    spec:
      containers:
      - name: student-login-container
        image: nginx
        ports:
        - containerPort: 80